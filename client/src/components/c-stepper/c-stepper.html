<div class="stepper-wrapper" part="wrapper">
  <div class="stepper" part="stepper">
    <button
      type="button"
      class="stepper-btn btn-decrement"
      part="btn btn-decrement"
      aria-label="Уменьшить"
    >
      <svg class="chevron chevron-left" viewBox="0 0 6 10" width="6" height="10" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 1L1 5L5 9" />
      </svg>
    </button>
    <input
      type="text"
      inputmode="numeric"
      role="spinbutton"
      class="stepper-value"
      part="value"
      aria-label="Числовое значение"
    />
    <button
      type="button"
      class="stepper-btn btn-increment"
      part="btn btn-increment"
      aria-label="Увеличить"
    >
      <svg class="chevron chevron-right" viewBox="0 0 6 10" width="6" height="10" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1L5 5L1 9" />
      </svg>
    </button>
  </div>
  <label class="stepper-label" part="label">
    <slot>отображать нод</slot>
  </label>
</div>
